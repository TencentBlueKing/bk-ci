# 服务配置文件模板
spring:
  datasource:
    url: jdbc:mysql://__BK_CI_MYSQL_ADDR__/devops_ci_log?useSSL=false&autoReconnect=true&serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&sessionVariables=sql_mode=%27STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION%27
    username: __BK_CI_MYSQL_USER__
    password: __BK_CI_MYSQL_PASSWORD__

# 服务器端口配置，在同一台机器上部署多个微服务，端口号要不同 21914
server:
  port: __BK_CI_LOG_API_PORT__

log:
  storage:
    type: __BK_CI_LOG_STORAGE_TYPE__                # 日志存储方式 lucene/elasticsearch
    coldInDay: __BK_CI_LOG_COLD_DAY__             # 索引转为冷索引，留空则为永不转冷
    deleteInDay: __BK_CI_LOG_DELETE_DAY__           # 索引自动删除时间，留空则为永不删除
  # 通过本地文件系统进行存储的必要配置
  lucene:
    dataDirectory: __BK_CI_LUCENE_DATA_DIR__        # 建立lucene索引的根目录
    indexMaxSize: __BK_CI_LUCENE_INDEX_MAX_SIZE__   # 单个构建的最大日志行数，建议设在100万内
  # 通过Elasticsearch服务进行存储的必要配置
  elasticsearch:
    ip: __BK_CI_ES_REST_ADDR__   # 今后只使用REST client.
    port: __BK_CI_ES_REST_PORT__
    cluster: __BK_CI_ES_CLUSTER_NAME__
    name: DEVOPS
    #  ES集群如果不要求账号密码认证，则可以去掉以下2个ES的访问账号密码配置项或留空
    username: __BK_CI_ES_USER__
    password: __BK_CI_ES_PASSWORD__
    #  ES集群如果要求HTTPS协议请求，则需要需要打开以下5个配置项， 设置keystore文件和truststore文件以及密码
    https: __BK_CI_ES_HTTPS__
#    keystore:
#      filePath:
#      password:
#    truststore:
#      filePath:
#      password:
  # origin 直写 ES 的 bulk 聚合（#13327）；enabled=false 回退为只投 storage 队列
  bulk:
    enabled: true
    maxDocs: 3000                 # 单集群缓冲文档数达到后 flush
    maxBytes: 5242880             # 单集群缓冲字节数达到后 flush（默认 5MB）
    maxWaitMs: 80                 # 最长等待毫秒，超时强制 flush
    maxBuildsPerBulk: 64          # 单次 bulk 最多混入的 buildId 数
    writeTimeoutMs: 300           # 单次 bulk 写 ES 超时；失败/超时可触发 degrade 熔断
    maxPendingBatches: 2000       # 待写出 batch 上限，达到后背压拒绝新 offer
  # origin 直写失败/过慢时熔断，降级到 storage 队列
  degrade:
    enabled: true
    forceStorage: false           # 紧急开关：true 时 origin 全部走 storage，不直写 ES
    circuitFailRate: 0.2          # 滑动窗口内失败（含过慢）占比达到后打开熔断
    circuitWindowMs: 10000        # 熔断统计窗口（毫秒）
    circuitOpenMs: 30000          # 熔断打开持续时间（毫秒）
    circuitMinSamples: 20         # 打开熔断前最少样本数，避免冷启动误伤
    slowMs: 300                   # 直写耗时超过该值计为过慢样本
  # 本地窗口吞吐统计与热点 build 分流（各 Pod 独立统计）
  traffic:
    enabled: true
    topN: 10                      # 定时日志打印的 topN（仅观测）
    windowMs: 30000               # 行数累计窗口；到期清零，热点粘性由 heavyStickyMs 独立维持
    heavyThreshold: 20000         # 窗口内累计行数达到后视为热点
    heavyStickyMs: 60000          # 热点粘性时长，跨计数窗口持续可走 heavy 队列
    routeHeavyEnabled: false      # 是否投独立 heavy origin 队列；开启前需创建对应 MQ topic
    maxTrackedBuilds: 8192        # 窗口跟踪槽位数；上万并发构建时需远大于 top 热点规模
    maxHeavyBuilds: 512           # 同时处于热点粘性的 build 上限（不是全量并发数）
