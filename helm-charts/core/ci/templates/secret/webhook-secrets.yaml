{{- $enabled := dict }}
{{- range $name, $cfg := .Values.secret.webhookSecrets }}
{{- if dig "autoGenerate" false ($cfg | default dict) }}
{{- $_ := set $enabled $name true }}
{{- end }}
{{- end }}
{{- if $enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bkci.webhookSecret.secretName" . }}
  labels: {{- include "bkci.labels.standard" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $name, $_ := $enabled }}
  {{ $name }}: {{ include "bkci.webhookSecret" (dict "name" $name "context" $) | b64enc | quote }}
  {{- end }}
{{- end }}
