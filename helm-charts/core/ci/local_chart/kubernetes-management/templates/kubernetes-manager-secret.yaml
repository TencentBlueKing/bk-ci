# 票据密钥走 Secret：lookup 读回已有值，首装 randAlphaNum 32。
# 所有副本读同一 Secret → 多副本一致；升级 lookup 保留原值 → 不踢在跑会话。
# 仓库公开串与空值都视为未配置，重新生成。
{{ if .Values.kubernetesManager.enabled -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "kubernetes-manager-auth" -}}
{{- $ticket := "" -}}
{{- if and $existing $existing.data -}}
{{- $ticket = index $existing.data "debugTicketSecret" | default "" | b64dec -}}
{{- end -}}
{{- $explicit := .Values.kubernetesManager.apiserver.auth.debugTicketSecret | default "" | toString -}}
{{- if and $explicit (ne $explicit "bkci-k8s-manager-debug-ticket-change-in-prod") -}}
{{- $ticket = $explicit -}}
{{- end -}}
{{- if or (not $ticket) (eq $ticket "bkci-k8s-manager-debug-ticket-change-in-prod") -}}
{{- $ticket = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-manager-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: kubernetes-manager
    app.kubernetes.io/component: kubernetes-manager
    app.kubernetes.io/name: kubernetes-manager
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  debugTicketSecret: {{ $ticket | quote }}
{{- end -}}
