# 票据密钥与身份签名密钥走 Secret：lookup 读回已有值，首装 randAlphaNum 32。
# 所有副本读同一 Secret → 多副本一致；升级 lookup 保留原值。
# 仓库公开串与空值都视为未配置，重新生成。
# identitySigningKey 必须复制到 dispatch.kubernetes.identitySigningKey，否则官方身份头验签失败。
{{ if .Values.kubernetesManager.enabled -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "kubernetes-manager-auth" -}}
{{- $ticket := "" -}}
{{- $identity := "" -}}
{{- if and $existing $existing.data -}}
{{- $ticket = index $existing.data "debugTicketSecret" | default "" | b64dec -}}
{{- $identity = index $existing.data "identitySigningKey" | default "" | b64dec -}}
{{- end -}}
{{- $explicitTicket := .Values.kubernetesManager.apiserver.auth.debugTicketSecret | default "" | toString -}}
{{- if and $explicitTicket (ne $explicitTicket "bkci-k8s-manager-debug-ticket-change-in-prod") -}}
{{- $ticket = $explicitTicket -}}
{{- end -}}
{{- $explicitIdentity := .Values.kubernetesManager.apiserver.auth.identitySigningKey | default "" | toString -}}
{{- if and $explicitIdentity (ne $explicitIdentity "bkci-k8s-manager-identity-sig-change-in-prod") -}}
{{- $identity = $explicitIdentity -}}
{{- end -}}
{{- if or (not $ticket) (eq $ticket "bkci-k8s-manager-debug-ticket-change-in-prod") -}}
{{- $ticket = randAlphaNum 32 -}}
{{- end -}}
{{- if or (not $identity) (eq $identity "bkci-k8s-manager-identity-sig-change-in-prod") -}}
{{- $identity = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-manager-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: kubernetes-manager
    app.kubernetes.io/component: kubernetes-manager
    app.kubernetes.io/name: kubernetes-manager
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  debugTicketSecret: {{ $ticket | quote }}
  identitySigningKey: {{ $identity | quote }}
{{- end -}}
