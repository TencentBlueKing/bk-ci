# 用户rtx头像（仅允许拉取当前鉴权用户自己的头像）
location ~ /(ms/|)([\w-_]+)/api/desktop/avatars/([A-Za-z0-9._@-]+)$ {
    header_filter_by_lua_file 'conf/lua/cors_filter.lua';
    auth_request /auth/desktop;
    auth_request_set $auth_uid $sent_http_x_devops_uid;
    set $path_rtx $3;

    access_by_lua_block {
        local auth_uid = ngx.var.auth_uid or ""
        local path_rtx = ngx.var.path_rtx or ""
        if auth_uid == "" or string.lower(auth_uid) ~= string.lower(path_rtx) then
            ngx.exit(403)
        end
    }

    proxy_read_timeout 60;
    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    set_by_lua_block $target {
        return config.dcloudHost
    }
    set $external_location "1";
    proxy_pass http://$target/Public/Avatar/$auth_uid.png;
    proxy_set_header Host $target;
    proxy_set_header X-Real_IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 离岸开发路径
location ~ /(ms/|)([\w-_]+)/api/desktop/(.*) {
    header_filter_by_lua_file 'conf/lua/cors_filter.lua';
    auth_request /auth/desktop;
    auth_request_set $uid $sent_http_x_devops_uid;
    auth_request_set $bk_token $sent_http_x_devops_bk_token;

    include proxy.set.header.common.conf;
    set $access_type 'desktop';
    set $service $2;
    set $path $3;
    set $target '';
    access_by_lua_file 'conf/lua/router_srv.lua';

    # 设置proxy header的变量
    proxy_set_header X-DEVOPS-UID $uid;
    proxy_set_header X-DEVOPS-BK-TOKEN $bk_token;
    proxy_set_header X-DEVOPS-BK-TICKET $bk_token;
    proxy_set_header X-DEVOPS-SERVICE-NAME $service;

    # 反向代理到目标ip，端口，路径和参数
    proxy_pass http://$target/api/desktop/$path?$args;
}

# ws分发
location ~ /(ms/|)([\w-_]+)/(websocket|ws)/desktop/(.*) {
    header_filter_by_lua_file 'conf/lua/cors_filter.lua';
    auth_request /auth/desktop;
    # 设置auth的变量
    include auth.request.set.user.conf;
    set $access_type 'user';
    set $service $2;
    set $source $3;
    set $path $4;
    set $target '';
    access_by_lua_file 'conf/lua/router_srv.lua';
    # 设置proxy header的变量
    include proxy.set.header.user.conf;
    proxy_set_header X-DEVOPS-SERVICE-NAME $service;
    # websocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    # 反向代理到目标ip，端口，路径和参数
    proxy_pass http://$target/$source/desktop/$path?$args;
}
