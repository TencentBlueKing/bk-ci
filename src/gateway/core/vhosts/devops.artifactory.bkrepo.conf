	# 插件图标存在公开的 static 仓库。用户态 generic 会附带平台凭证，
	# 凭证校验失败时响应带 WWW-Authenticate，浏览器加载图片会弹出登录框。
	# 转到 /bk-plugin-fe/，与网关静态代理同一条公开路径。
	location ~ ^/(?:ms/)?bkrepo/api/user/generic/%2F([^%]*bk-store)%2Fstatic%2F(.*)$ {
		set $static_logo_path $2;
		rewrite_by_lua_block {
			local rest = ngx.unescape_uri(ngx.var.static_logo_path or "")
			if rest == "" or string.find(rest, "..", 1, true) or string.sub(rest, 1, 1) == "/" then
				ngx.exit(400)
			end
			local prefix = ngx.var.bk_ci_public_path or ""
			if string.find(prefix, "__BK_", 1, true) then
				prefix = ""
			end
			prefix = string.gsub(prefix, "/+$", "")
			return ngx.redirect(prefix .. "/bk-plugin-fe/" .. rest, ngx.HTTP_MOVED_TEMPORARILY)
		}
	}

	location ~ ^/(?:ms/)?bkrepo/api/user/generic/([^/]*bk-store)/static/(.+)$ {
		set $static_logo_path $2;
		rewrite_by_lua_block {
			local rest = ngx.unescape_uri(ngx.var.static_logo_path or "")
			if rest == "" or string.find(rest, "..", 1, true) or string.sub(rest, 1, 1) == "/" then
				ngx.exit(400)
			end
			local prefix = ngx.var.bk_ci_public_path or ""
			if string.find(prefix, "__BK_", 1, true) then
				prefix = ""
			end
			prefix = string.gsub(prefix, "/+$", "")
			return ngx.redirect(prefix .. "/bk-plugin-fe/" .. rest, ngx.HTTP_MOVED_TEMPORARILY)
		}
	}

	# 构建机层服务分发
	location ~ ^/(ms/|)bkrepo/api/build/(.*) {
		auth_request /auth/build;
		
		# 设置auth的变量
		include auth.request.set.build.conf;

		set $access_type 'build';
		set $service "bkrepo";
		set $path $2;
		set $target '';
		
		access_by_lua_file 'conf/lua/router_srv.lua';
		
		include set.bkrepo.conf;

		# 设置proxy header的变量
		include proxy.set.header.build.conf;

		if ($request_uri ~* ^/(ms/|)bkrepo/api/build/(.*)) {
            proxy_pass http://$target/$2;
        }

		# content_by_lua_block {
		# 		ngx.say(ngx.var.path)
		# }

		# 反向代理到目标ip，端口，路径和参数
		# proxy_pass http://$target/api/$path?$args;
	}

	
	# user层服务分发
	location ~ ^/(ms/|)bkrepo/api/user/(.*) {
