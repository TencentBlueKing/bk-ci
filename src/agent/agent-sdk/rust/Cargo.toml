[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "io-std", "fs", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt", "codec", "io"] }
bytes = "1"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["json", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
axum = "0.8"
