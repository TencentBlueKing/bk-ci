[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bkci-agent-sdk"
version = "0.1.2"
description = "BK-CI third-party build agent SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tencent BlueKing" }]
keywords = ["bk-ci", "agent", "sdk", "ci", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[tool.setuptools.packages.find]
include = ["bkci_agent_sdk*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
