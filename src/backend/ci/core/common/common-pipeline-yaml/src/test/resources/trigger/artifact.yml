version: v3.0
name: artifact-trigger-test
on:
  artifact:
    arrived:
      name: 制品到达触发
      repository: pipeline
      kind: file
      watch-pipeline:
        - .ci/plugins/archive.yml
      artifacts-name:
        - "*.msi"
        - "setup-*.exe"
      artifacts-name-ignore:
        - "*_unsigned.exe"
      metadata:
        - key: quality-gate
          operator: eq
          value: passed
stages:
  - name: stage-1
    jobs:
      job1:
        name: test-job
        runs-on:
          pool-name: docker
        steps:
          - name: test-step
            uses: linuxScript@1.*
            with:
              script: "echo hello"
