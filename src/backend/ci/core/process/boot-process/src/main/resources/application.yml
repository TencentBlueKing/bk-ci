spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: process${service-suffix}
    desc: DevOps Pipeline Service
    version: 4.0.0
    packageName: com.tencent.devops.process

# 并发配置
queueConcurrency:
  buildStart: 5
  stage: 5
  container: 5
  task: 10
  buildFinish: 5
  buildCancel: 5
  pipelineCreate: 5
  pipelineDelete: 2
  pipelineUpdate: 5
  timerTrigger: 5
  monitor: 1
  webhook: 1
  measure: 1
  market: 1
  containerStartup: 1
  heartBeat: 1
  timerChanger: 1

server:
  port: 21921

# 创作流 IMATE Stage 审核对接 CDS 开放审批。发布后由管理员在 CDS 登记 saasId=bk-ci-creative-stream。
cds:
  approval:
    host: https://cds-sz.bkdevops.qq.com
    appId: bk-ci-creative-stream
    appSecret: ${CDS_APPROVAL_APP_SECRET:}
